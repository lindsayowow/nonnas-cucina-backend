spring.application.name=nonna

spring.datasource.url=jdbc:mysql://localhost:3306/nonna?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Base64-encoded, 256-bit key required for HS256.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

#gemini.api.key=${GOOGLE_API_KEY} - not needed

#Environmental variables used to protect secrets